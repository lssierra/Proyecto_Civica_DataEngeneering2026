version: 2

models:
###################################################################################################################################################
  - name: int_arrivals_7days_ops
    description: Filters latest ingestion, deduplicates by docking_id and casts columns from OPS shore power data for the next 7 days
    data_tests:
      - unique_docking_combination
      
    columns:
    - name: docking_year
      description: year docking took place
      data_tests:
        - not_null
    - name: docking_seq
      description: number that identifies the sequence of the docking
      data_tests:
        - not_null    
    - name: SHIP_NAME
      description: Name of the vessel
      data_tests:
      - not_null:
          config:
            severity: error
    - name: DOCKING_ID
      description: Unique identifier for the port call
      data_tests:
      - not_null:
          config:
            severity: error
    - name: COUNTRY_ID
      description: ISO country code
      data_tests:
      - not_null:
          config:
            severity: error
    - name: COUNTRY_NAME
      description: Name of the country
    - name: IMO
      description: IMO vessel identification number
      data_tests:
      - not_null:
          config:
            severity: error
    - name: SHIPPINGCOMPANY_ID
      description: Identifier of the shipping company
      data_tests:
      - not_null:
          config:
            severity: error
    - name: SHIPPINGCOMPANY_NAME
      description: Name of the shipping company
    - name: CONSIGNEE
      description: Port consignee handling the call
    - name: SHIPTYPE_ID
      description: Code identifying the vessel type
      data_tests:
      - not_null:
          config:
            severity: error
    - name: SHIPTYPE_NAME
      description: Name of the vessel type
    - name: SHIP_LENGTH
      description: Length of the vessel as float
    - name: GT
      description: Gross tonnage of the vessel as float
    - name: DOCK_ID
      description: Code identifying the berth/moll
      data_tests:
      - not_null:
          config:
            severity: error
    - name: DOCK_NAME
      description: Name of the berth/dock alignment
    - name: DOCK_MODULES
      description: Modules within the berth
    - name: ETA
      description: Estimated time of arrival as timestamp
    - name: ETD
      description: Estimated time of departure as timestamp
    - name: _INGESTED_AT
      description: Timestamp when the record was ingested into the bronze layer
      data_tests:
      - not_null:
          config:
            severity: error
    - name: _SOURCE_URL
      description: URL of the source API endpoint
###################################################################################################################################################
  - name: int_arrivals_7days
    description: Filters latest ingestion, deduplicates by docking_id and casts columns from 7-day arrivals
    data_tests:
      - unique_docking_combination
    columns:
    - name: DOCKING_YEAR
      description: Year of the port call as integer
      data_tests:
      - not_null:
          config:
            severity: error
    - name: DOCKING_ID
      description: Unique identifier for the port call
      data_tests:
      - not_null:
          config:
            severity: error
    - name: docking_seq
      description: number that identifies docking sequence
      data_tests:
        - not_null
        
    - name: DOCKINGSTATUS_DESC
      description: Human-readable description of the docking status
    - name: SHIP_NAME
      description: Name of the vessel
      data_tests:
      - not_null:
          config:
            severity: error
    - name: SHIPTYPE_NAME
      description: Name of the vessel type
    - name: MMSI
      description: Maritime Mobile Service Identity number as integer
    - name: IMO
      description: IMO vessel identification number
      data_tests:
      - not_null:
          config:
            severity: error
    - name: CALLSIGN
      description: Radio callsign of the vessel
    - name: SHIP_LENGTH
      description: Length of the vessel in metres as float
    - name: SHIP_DRAFT
      description: Draft of the vessel in metres as float
    - name: SHIP_WIDTH
      description: Beam/width of the vessel in metres as float
    - name: COUNTRY_ID
      description: ISO country code
      data_tests:
      - not_null:
          config:
            severity: error
    - name: COUNTRY_NAME
      description: Name of the country
    - name: SHIPPINGCOMPANY_NAME
      description: Name of the shipping company
    - name: SHIPPINGCOMPANY_ID
      description: Identifier of the shipping company
      data_tests:
      - not_null:
          config:
            severity: error
    - name: CONSIGNEE
      description: Port agent / consignee handling the call
    - name: TERMINAL_ID
      description: Code identifying the terminal
    - name: TERMINAL_NAME
      description: Name of the terminal
    - name: DOCK_ID
      description: Code identifying the berth/moll
      data_tests:
      - not_null:
          config:
            severity: error
    - name: DOCK_MODULES
      description: Modules within the berth
    - name: DOCKINGSTATUS_ID
      description: Operational status code of the port call
      data_tests:
      - not_null:
          config:
            severity: error
    - name: ETADIA
      description: ETA day component as date
    - name: ETAHORA
      description: ETA hour component as time
    - name: ETAUTC
      description: ETA in UTC as timestamp
    - name: ETA
      description: Estimated time of arrival as timestamp
    - name: ETDDIA
      description: ETD day component as date
    - name: ETDHORA
      description: ETD hour component as time
    - name: ETDUTC
      description: ETD in UTC as timestamp
    - name: ETD
      description: Estimated time of departure as timestamp
    - name: ORIGINPORT_ID
      description: UNLOCODE of the port of origin
    - name: ORIGINPORT_NAME
      description: Name of the port of origin
    - name: DESTINATIONPORT_ID
      description: UNLOCODE of the destination port
    - name: DESTINATIONPORT_NAME
      description: Name of the destination port
    - name: MARINETRAFFIC_URL
      description: MarineTraffic link for additional vessel info
    - name: _INGESTED_AT
      description: Timestamp when the record was ingested into the bronze layer
      data_tests:
      - not_null:
          config:
            severity: error
    - name: _SOURCE_URL
      description: URL of the source API endpoint
