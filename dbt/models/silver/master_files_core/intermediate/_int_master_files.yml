version: 2

models:
  - name: int_countries
    description: >
      Filters the latest ingestion records from the countries staging model,
      deduplicates records keeping the most recent ingestion, and returns standardized country attributes.
    columns:
      - name: country_id
        description: Unique identifier of the country.
      - name: country_name
        description: Name of the country.
      - name: econarea
        description: Economic area associated with the country.
      - name: forelandarea_id
        description: Identifier of the related foreland area.
      - name: subforelandarea_id
        description: Identifier of the related subforeland area.
      - name: _INGESTED_AT
        description: Timestamp indicating when the record was ingested.
      - name: row_hash
        description: Surrogate hash key generated from all business columns for change tracking and deduplication.

