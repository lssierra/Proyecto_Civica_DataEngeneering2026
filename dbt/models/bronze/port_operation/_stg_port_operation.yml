version: 2
models:
  - name: stg_port_operations__port_bcn_arrivals_today_raw
    description: Today's vessel arrivals at Port of Barcelona
    columns:
    - name: docking_year
      description: Year of the port call
      data_tests:
      - not_null:
          config:
            severity: error
    - name: docking_id
      description: Unique identifier for the port call (escala)
      data_tests:
      - not_null:
          config:
            severity: error
    - name: dockingstatus_desc
      description: Human-readable description of the docking status
    - name: ship_name
      description: Name of the vessel
      data_tests:
      - not_null:
          config:
            severity: error
    - name: shiptype_name
      description: Name/description of the vessel type
    - name: MMSI
      description: Maritime Mobile Service Identity number
    - name: IMO
      description: IMO vessel identification number
      data_tests:
      - not_null:
          config:
            severity: error
    - name: CALLSIGN
      description: Radio callsign of the vessel
    - name: ship_length
      description: Length of the vessel in metres (eslora)
    - name: ship_draft
      description: Draft of the vessel in metres (calado)
    - name: ship_width
      description: Beam/width of the vessel in metres (manga)
    - name: country_id
      description: ISO country code
      data_tests:
      - not_null:
          config:
            severity: error
    - name: country_name
      description: Name of the country
    - name: shippingcompany_name
      description: Name of the shipping company / naviera
    - name: shippingcompany_id
      description: Identifier of the shipping company / naviera
      data_tests:
      - not_null:
          config:
            severity: error
    - name: consignee
      description: Port agent / consignee handling the call
    - name: terminal_id
      description: Code identifying the terminal or internal port location
      data_tests:
      - not_null:
          config:
            severity: error
    - name: terminal_name
      description: Name of the terminal or internal port location
    - name: dock_id
      description: Code identifying the berth/moll
      data_tests:
      - not_null:
          config:
            severity: error
    - name: dock_modules
      description: Modules within the berth
    - name: dockingstatus_id
      description: Operational status code of the port call
      data_tests:
      - not_null:
          config:
            severity: error
    - name: ETADIA
      description: ETA day component (raw)
    - name: ETAHORA
      description: ETA hour component (raw)
    - name: ETAUTC
      description: ETA in UTC (raw)
    - name: ETA
      description: Estimated time of arrival
    - name: ETDDIA
      description: ETD day component (raw)
    - name: ETDHORA
      description: ETD hour component (raw)
    - name: ETDUTC
      description: ETD in UTC (raw)
    - name: ETD
      description: Estimated time of departure
    - name: originport_id
      description: UNLOCODE of the port of origin
    - name: originport_name
      description: Name of the port of origin
    - name: destinationport_id
      description: UNLOCODE of the destination port
    - name: destinationport_name
      description: Name of the destination port
    - name: marinetraffic_url
      description: MarineTraffic link for additional vessel info
    - name: _INGESTED_AT
      description: Timestamp when the record was ingested into the bronze layer
      data_tests:
      - not_null:
          config:
            severity: error
    - name: _SOURCE_URL
      description: URL of the source API endpoint that provided this record
